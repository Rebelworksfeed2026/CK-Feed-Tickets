<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed Tickets Cloud Beta</title><link rel="stylesheet" href="cloud-beta.css"><header><h2>C&K Feed Tickets — Cloud Beta</h2></header><main><div class="card"><p id="status">Connecting…</p><div id="login" hidden><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button></div><button id="signout" hidden>Sign out</button><a href="./">Original feed sheet</a></div><div id="app" hidden><div class="card"><div id="tabs"></div><label>Week starting Saturday<input id="week" type="date"></label><p id="access"></p></div><div class="card" id="entry"><h3>New ticket</h3><label>Date<input id="date" type="date"></label><label>Ticket #<input id="ticket"></label><label>Tons<input id="tons" type="number" step=".01"></label><label>Destination<input id="dest"></label><button id="save">Save to cloud</button><button id="cancel" hidden>Cancel edit</button></div><div class="card"><h3 id="title">Feed sheet</h3><div class="scroll"><table><thead><tr><th>Day</th><th>Load</th><th>Ticket #</th><th>Tons</th><th>Destination</th><th>Daily</th><th>Weekly</th><th>Actions</th></tr></thead><tbody id="rows"></tbody><tfoot id="totals"></tfoot></table></div><p id="highlights"></p></div><div class="card"><h3>Comparison</h3><p id="compare"></p></div></div></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script><script src="cloud-beta.js"></script><script src="cloud-tools.js"></script></html>
