<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&K Feed Tickets — Sign In</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#183449;background:#eef3f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:420px;background:#fff;border-radius:14px;padding:25px;box-shadow:0 4px 24px #1234}
h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;color:#526778}label{display:block;margin:15px 0 6px;font-weight:650}
input,button{font:inherit;width:100%;padding:12px;border-radius:8px}input{border:1px solid #b5c5d1}
button{background:#17628e;color:white;border:0;margin-top:18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.secondary{background:#e6eef3;color:#183449}
#message{min-height:22px;font-size:14px}#profile{display:none}.muted{font-size:13px}
</style>
</head>
<body>
<main>
<h1>C&K Feed Tickets</h1>
<p>Secure account sign-in setup</p>
<form id="login">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Sign in</button>
</form>
<section id="profile" aria-live="polite">
<h2 id="welcome"></h2><p id="role"></p>
<p class="muted">Account verified. Delivery sheets will be connected after permissions testing is complete.</p>
<button id="logout" class="secondary" type="button">Sign out</button>
</section>
<p id="message" role="status" aria-live="polite"></p>
<p class="muted">Only invited, assigned accounts can access this screen. Do not enter test tickets here.</p>
</main>
<script src="supabase-config.js"></script><script src="cloud.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
$("login").addEventListener("submit", async e => {
  e.preventDefault();
  $("submit").disabled = true;
  $("message").textContent = "Checking account…";
  try {
    const profile = await CKCloud.signIn($("email").value.trim(), $("password").value);
    $("password").value = "";
    $("login").style.display = "none";
    $("profile").style.display = "block";
    $("welcome").textContent = "Welcome, " + profile.name;
    $("role").textContent = "Access: " + (profile.is_admin ? "Administrator" : profile.is_office ? "Office" : "Driver") + " · " + profile.company;
    $("message").textContent = "Signed in successfully.";
  } catch (err) {
    $("password").value = "";
    $("message").textContent = err.message || "Sign-in failed.";
  } finally {
    $("submit").disabled = false;
  }
});
$("logout").addEventListener("click", async () => {
  $("logout").disabled = true;
  try { await CKCloud.signOut(); $("message").textContent = "Signed out."; }
  catch (err) { $("message").textContent = "Sign-out error: " + err.message; }
  finally {
    $("logout").disabled = false;
    $("profile").style.display = "none";
    $("login").style.display = "block";
  }
});
})();
</script>
</body>
</html>
