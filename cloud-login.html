<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feed Tickets — Sign In Test</title><style>body{font:17px -apple-system,Arial;background:#eef3f6;color:#17354d;margin:0}header{background:#17354d;color:white;padding:18px}main{max-width:500px;margin:20px auto;padding:16px;background:white;border-radius:12px}input,button{display:block;width:100%;box-sizing:border-box;font:inherit;padding:12px;margin:12px 0;border-radius:8px}input{border:1px solid #aaa}button{background:#17628e;color:white;border:0}#message{overflow-wrap:anywhere}</style><header><h2>C&K Feed Tickets</h2>Secure account test</header><main><p>This page tests your driver account. Your existing ticket records are not changed.</p><div id="form"><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button><button id="forgot" type="button" style="background:#63788b">Forgot password? Email me a reset link</button></div><p id="message" role="status"></p><button id="logout" hidden>Sign out</button><p><a href="./">Return to original feed sheet</a></p></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id);
const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
async function show(){const {data:{user}}=await client.auth.getUser();if(!user){$('form').hidden=false;$('logout').hidden=true;return}const {data,error}=await client.from('drivers').select('name,company').eq('user_id',user.id).maybeSingle();$('form').hidden=true;$('logout').hidden=false;$('message').textContent=error?'Driver lookup failed: '+error.message:data?'Signed in as '+data.name+' — '+data.company:'Signed in, but no driver is linked to this account.'}
$('login').onclick=async()=>{$('message').textContent='Signing in…';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){$('message').textContent=error.message;return}$('message').textContent='';await show()};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){$('message').textContent='Enter your email address above first.';return}$('message').textContent='Requesting reset email…';const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$('message').textContent=error?'Could not send reset email: '+error.message:'If this email has an account, a password reset link will arrive shortly. Check your inbox and spam folder.'};
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){ $('form').hidden=false;$('logout').hidden=true;$('message').textContent='Reset link opened. Enter your new password below.';$('email').parentElement.hidden=true;$('login').textContent='Save new password';$('login').onclick=async()=>{const password=$('password').value;if(password.length<8){$('message').textContent='Use at least 8 characters.';return}const {error}=await client.auth.updateUser({password});$('password').value='';$('message').textContent=error?error.message:'Password updated. You can now sign in.';if(!error){$('login').textContent='Sign in';location.replace(location.origin+location.pathname)}}}});
$('logout').onclick=async()=>{await client.auth.signOut();$('message').textContent='Signed out.';await show()};
show().catch(e=>$('message').textContent=e.message);
</script></html>
